[project]
name = "llm-zoomcamp-onnx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Johan Joseph George", email = "125449686+JohanGeorge04@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gitsource>=0.0.5",
    "minsearch>=0.2.0",
    "numpy>=2.4.4",
    "onnxruntime==1.28.0",
    "tokenizers>=0.23.1",
    "tqdm>=4.66.5",
]

[project.scripts]
llm-zoomcamp-onnx = "llm_zoomcamp_onnx:main"

[build-system]
